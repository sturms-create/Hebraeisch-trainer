ard{padding:30px 32px 26px;text-align:center}.eyebrow{margin:0;color:var(--muted);font-size:13px;letter-spacing:.9px;text-transform:uppercase}.question-word{min-height:128px;margin:14px 0 18px;direction:rtl;display:flex;align-items:center;justify-content:center;gap:2px;font-size:clamp(58px,8vw,84px);line-height:1.25}.segment.prefix{color:var(--prefix);font-weight:700}.segment.root{color:var(--root);font-weight:700}.segment.suffix{color:var(--suffix);font-weight:700}.options-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:940px;margin:0 auto}.answer-button,.next-button{border-radius:12px;cursor:pointer;font:inherit;font-weight:700;transition:.15s}.answer-button{min-height:62px;padding:12px 14px 12px 18px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}.answer-button:hover{border-color:#b88c12;background:#fffbef;transform:translateY(-1px)}.key{flex:0 0 auto;padding:4px 8px;border-radius:6px;background:#eef2f7;color:var(--muted);font-size:11px;font-weight:500}.explanation-box{display:none;max-width:940px;margin:20px auto 0;padding:20px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;text-align:left}.feedback-text{margin-bottom:8px;text-align:center;font-size:19px;font-weight:700}.correct{color:var(--success)}.wrong{color:var(--danger)}.explanation-meta{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}.explanation-copy{color:#33445e;font-size:15px;line-height:1.55}.next-button{margin:17px auto 0;padding:12px 20px;border:1px solid #34445c;background:var(--navy2);color:#fff;display:block}.next-button:hover{background:var(--navy)}.legend{margin-top:25px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:center;flex-wrap:wrap;gap:12px 22px;color:var(--muted);font-size:12px}.legend-item{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%}footer{padding:22px 0 0;color:var(--muted);text-align:center;font-size:12px}@media(max-width:820px){.page{width:min(100% - 24px,700px)}.site-header{min-height:120px;padding:28px 24px 24px}.header-badge{display:none}.toolbar{grid-template-columns:repeat(3,1fr)}.level-card{grid-column:1/-1}.trainer-card{padding:26px 18px 22px}}@media(max-width:570px){.page{width:calc(100% - 16px)}.level-card{align-items:stretch;flex-direction:column}select{width:100%}.options-grid{grid-template-columns:1fr}.stat-card{min-height:68px;padding:10px 5px}.stat-card strong{font-size:18px}.question-word{min-height:105px}}

<body><main class="page">
<header class="site-header"><div class="brand"><h1>Biblia Hebraica</h1><p>Formentrainer · Profi-Modus</p></div><div class="header-badge">Morphologie trainieren</div></header>
<section class="toolbar" aria-label="Lernstand und Punktestand">

</section>

<section class="trainer-card" aria-labelledby="task-label"><p class="eyebrow" id="task-label">Bestimme Stamm, Form und Person</p><div class="question-word" id="word-container" aria-live="polite"></div><div class="options-grid" id="options-container"></div>

<footer>Dein Lernstand und dein Rekord bleiben lokal in diesem Browser gespeichert.</footer>
</main><script type="application/x-disabled">
const db=[
{lesson:8,plainText:"שָׁמַר",info:"Wurzel: שמר (bewahren)",segments:[{text:"שָׁמַר",type:"root"}],correctId:0,explanation:"Reine Wurzelform des starken Verbs im Perfekt. Es ist kein Personalsuffix vorhanden."},
{lesson:8,plainText:"שָׁמְרָה",info:"Wurzel: שמר (bewahren)",segments:[{text:"שָׁמְרָ",type:"root"},{text:"ה",type:"suffix"}],correctId:1,explanation:"Das Suffix ָה am Ende kennzeichnet im Perfekt die 3. Person feminin Singular."},
{lesson:8,plainText:"שָׁמַרְתָּ",info:"Wurzel: שמר (bewahren)",segments:[{text:"שָׁמַרְ",type:"root"},{text:"תָּ",type:"suffix"}],correctId:2,explanation:"Das Suffix תָּ am Ende steht im Perfekt für die 2. Person maskulin Singular."},
{lesson:9,plainText:"יִשְׁמֹר",info:"Wurzel: שמר (bewahren)",segments:[{text:"יִ",type:"prefix"},{text:"שְׁמֹר",type:"root"}],correctId:3,explanation:"Das Präfix יִ am Anfang markiert die 3. Person maskulin Singular im Imperfekt."},
{lesson:9,plainText:"תִּשְׁמְרִי",info:"Wurzel: שמר (bewahren)",segments:[{text:"תִּ",type:"prefix"},{text:"שְׁמְ",type:"root"},{text:"רִי",type:"suffix"}],correctId:4,explanation:"Das Präfix תִּ und der Ausgang ִי bilden zusammen die 2. Person feminin Singular im Imperfekt."},
{lesson:12,plainText:"עָמַד",info:"Wurzel: עמד (stehen) · I-Guttural",segments:[{text:"עָמַד",type:"root"}],correctId:0,explanation:"Perfekt 3. Person maskulin Singular eines Verbs mit Guttural am Anfang. Das ע trägt hier Qamets."},
{lesson:12,plainText:"יַעֲמֹד",info:"Wurzel: עמד (stehen) · I-Guttural",segments:[{text:"יַ",type:"prefix"},{text:"עֲמֹד",type:"root"}],correctId:3,explanation:"Das Guttural ע erhält Hatef-Patach. Deshalb passt sich der Vokal des Präfixes an: יַ statt יִ."},
{lesson:10,plainText:"קָטֹן",info:"Wurzel: קטן (klein sein) · Zustandsverb",segments:[{text:"קָטֹן",type:"root"}],correctId:0,explanation:"Ein Zustandsverb des Holem-Typs im Perfekt 3. Person maskulin Singular: ‚Er ist klein.‘"},
{lesson:13,plainText:"יִקְטַן",info:"Wurzel: קטן (klein sein) · Zustandsverb",segments:[{text:"יִ",type:"prefix"},{text:"קְטַן",type:"root"}],correctId:3,explanation:"Im Imperfekt wechselt der Holem-Stamm in der letzten Silbe bei der 3. Person maskulin Singular zu Patach."},
{lesson:10,plainText:"קָטֹנְתִּי",info:"Wurzel: קטן (klein sein) · Zustandsverb",segments:[{text:"קָטֹנְ",type:"root"},{text:"תִּי",type:"suffix"}],correctId:5,explanation:"Bei Holem-Zustandsverben bleibt das Holem in der 1. Person Singular erhalten: ‚Ich war klein.‘"}
];
const optionsList=[{id:0,text:"Perfekt · 3. Pers. m. Sg. (er)"},{id:1,text:"Perfekt · 3. Pers. f. Sg. (sie)"},{id:2,text:"Perfekt · 2. Pers. m. Sg. (du)"},{id:3,text:"Imperfekt · 3. Pers. m. Sg. (er)"},{id:4,text:"Imperfekt · 2. Pers. f. Sg. (du)"},{id:5,text:"Perfekt · 1. Pers. Sg. (ich)"}];
const lessonSelect=document.getElementById("lesson-select"),availableLessons=[...new Set(db.map(x=>x.lesson))].sort((a,b)=>a-b),minimumLesson=availableLessons[0],maximumLesson=availableLessons.at(-1),savedLesson=parseInt(localStorage.getItem("heb_lesson"),10);let selectedLesson=Number.isInteger(savedLesson)&&savedLesson>=minimumLesson&&savedLesson<=maximumLesson?savedLesson:maximumLesson,score=0,streak=0,highscore=parseInt(localStorage.getItem("heb_highscore"),10)||0,currentQuestion=null,previousQuestion=null,answered=false;
for(let lesson=minimumLesson;lesson<=maximumLesson;lesson++){const option=document.createElement("option");option.value=lesson;option.textContent=`Bis einschließlich Lektion ${lesson}`;option.selected=lesson===selectedLesson;lessonSelect.appendChild(option)}
function activeForms(){return db.filter(x=>x.lesson<=selectedLesson)}
function updateScoreboard(){document.getElementById("score-val").textContent=score;document.getElementById("streak-val").textContent=streak;document.getElementById("highscore-val").textContent=highscore;document.getElementById("streak-val").classList.toggle("streak-active",streak>=5)}
function updatePoolNote(){const n=activeForms().length;document.getElementById("pool-note").textContent=`${n} ${n===1?"Form":"Formen"} aus den Lektionen 1–${selectedLesson} sind jetzt aktiv.`}
function chooseQuestion(){const pool=activeForms();if(pool.length===1)return pool[0];const alternatives=pool.filter(x=>x!==previousQuestion);return alternatives[Math.floor(Math.random()*alternatives.length)]}
function initGame(){answered=false;updateScoreboard();updatePoolNote();document.getElementById("explanation-box").style.display="none";currentQuestion=chooseQuestion();previousQuestion=currentQuestion;const wc=document.getElementById("word-container");wc.replaceChildren();const word=document.createElement("span");word.textContent=currentQuestion.plainText;wc.appendChild(word);const oc=document.getElementById("options-container");oc.replaceChildren();optionsList.forEach((option,index)=>{const button=document.createElement("button");button.type="button";button.className="answer-button";button.innerHTML=`<span>${option.text}</span><span class="key">Taste ${index+1}</span>`;button.addEventListener("click",()=>checkAnswer(option.id));oc.appendChild(button)})}
function checkAnswer(selectedId){if(answered)return;answered=true;const correct=selectedId===currentQuestion.correctId;if(correct){score+=10;streak++;if(streak>highscore){highscore=streak;localStorage.setItem("heb_highscore",String(highscore))}}else streak=0;updateScoreboard();const wc=document.getElementById("word-container");wc.replaceChildren();currentQuestion.segments.forEach(segment=>{const span=document.createElement("span");span.className=`segment ${segment.type}`;span.textContent=segment.text;wc.appendChild(span)});const status=document.getElementById("feedback-status");if(correct){status.className="feedback-text correct";status.textContent="Richtig! +10 Punkte"}else{const right=optionsList.find(x=>x.id===currentQuestion.correctId);status.className="feedback-text wrong";status.textContent=`Noch nicht. Richtig ist: ${right.text}`}document.getElementById("explanation-text").innerHTML=`<span class="explanation-meta">Lektion ${currentQuestion.lesson} · ${currentQuestion.info}</span>${currentQuestion.explanation}`;document.getElementById("explanation-box").style.display="block";document.getElementById("next-button").focus()}
lessonSelect.addEventListener("change",event=>{selectedLesson=parseInt(event.target.value,10);localStorage.setItem("heb_lesson",String(selectedLesson));previousQuestion=null;score=0;streak=0;initGame()});document.getElementById("next-button").addEventListener("click",initGame);window.addEventListener("keydown",event=>{if(event.key==="Enter"&&answered){initGame();return}const n=parseInt(event.key,10);if(n>=1&&n<=optionsList.length&&!answered)checkAnswer(optionsList[n-1].id)});initGame();
</script>
<script>
const forms=[];
const persons={p3ms:"3. Pers. m. Sg.",p3fs:"3. Pers. f. Sg.",p2ms:"2. Pers. m. Sg.",p2fs:"2. Pers. f. Sg.",p1cs:"1. Pers. Sg.",p3cp:"3. Pers. Pl.",p3mp:"3. Pers. m. Pl.",p3fp:"3. Pers. f. Pl.",p2mp:"2. Pers. m. Pl.",p2fp:"2. Pers. f. Pl.",p1cp:"1. Pers. Pl.",ms:"m. Sg.",fs:"f. Sg.",mp:"m. Pl.",fp:"f. Pl."};
function add(lesson,stem,category,root,items,note="Regelmäßige Bildung nach dem Paradigma der Lektion."){items.forEach(([word,person])=>forms.push({lesson,stem,category,root,word,person:persons[person]||person,answer:`${stem} · ${category}${person?` · ${persons[person]||person}`:""}`,note}))}
const perfStrong=[["שָׁמַר","p3ms"],["שָׁמְרָה","p3fs"],["שָׁמַרְתָּ","p2ms"],["שָׁמַרְתְּ","p2fs"],["שָׁמַרְתִּי","p1cs"],["שָׁמְרוּ","p3cp"],["שְׁמַרְתֶּם","p2mp"],["שְׁמַרְתֶּן","p2fp"],["שָׁמַרְנוּ","p1cp"]];

add(8,"Qal","Perfekt","שמר",perfStrong,"Die Personalendung kennzeichnet Person, Genus und Numerus.");
add(9,"Qal","Perfekt · schwach","verschiedene",[["עָמַד","p3ms"],["מָצָא","p3ms"],["בָּנָה","p3ms"],["בָּנְתָה","p3fs"],["קָם","p3ms"],["קַמְתָּ","p2ms"],["נָפַל","p3ms"],["יָשַׁב","p3ms"],["סָבַב","p3ms"]],"Die Schwachklasse verändert einzelne Stammvokale oder Radikale.");
add(10,"Qal","Perfekt · Zustandsverb","קטן",[["קָטֹן","p3ms"],["קָטְנָה","p3fs"],["קָטֹנְתָּ","p2ms"],["קָטֹנְתְּ","p2fs"],["קָטֹנְתִּי","p1cs"],["קָטְנוּ","p3cp"],["קְטֹנְתֶּם","p2mp"],["קְטֹנְתֶּן","p2fp"],["קָטֹנּוּ","p1cp"]],"Zustandsverben können im Perfekt ein Sere oder Holem als Stammvokal zeigen.");
add(11,"Qal","Imperfekt","שמר",impfStrong,"Präformativ und gegebenenfalls Endung kennzeichnen Person, Genus und Numerus.");
add(12,"Qal","Imperfekt · schwach","verschiedene",[["יַעֲמֹד","p3ms"],["יִמְצָא","p3ms"],["יִבְנֶה","p3ms"],["תִּבְנִי","p2fs"],["יָקוּם","p3ms"],["יִפֹּל","p3ms"],["יֵשֵׁב","p3ms"],["יָסֹב","p3ms"]],"Die Schwachklasse beeinflusst Präformativvokal, Stammvokal oder Radikale.");
add(13,"Qal","Imperfekt · Zustandsverb","verschiedene",[["יִקְטַן","p3ms"],["תִּקְטַן","p3fs"],["אֶקְטַן","p1cs"],["יִכְבַּד","p3ms"],["יִזְקַן","p3ms"]],"Zustandsverben zeigen im Imperfekt häufig Patach oder Sere in der Stammsilbe.");
add(15,"Qal","Narrativ","שמר",[["וַיִּשְׁמֹר","p3ms"],["וַתִּשְׁמֹר","p3fs"],["וַתִּשְׁמְרִי","p2fs"],["וָאֶשְׁמֹר","p1cs"],["וַיִּשְׁמְרוּ","p3mp"],["וַנִּשְׁמֹר","p1cp"]],"Waw mit Patach und Dagesch vor der Imperfektform kennzeichnet meist die Erzählvergangenheit.");
add(15,"Qal","Waw-Perfekt","שמר",perfStrong.map(([w,p])=>["וְ"+w,p]),"Waw vor einer Perfektform kann in einer Folge zukünftige oder modale Bedeutung tragen.");
add(16,"Qal","Imperativ","שמר",[["שְׁמֹר","p2ms"],["שִׁמְרִי","p2fs"],["שִׁמְרוּ","p2mp"],["שְׁמֹרְנָה","p2fp"]],"Der Imperativ existiert nur in der 2. Person.");
add(16,"Qal","Imperativ · schwach","verschiedene",[["קוּם","p2ms"],["קוּמִי","p2fs"],["קוּמוּ","p2mp"],["לֵךְ","p2ms"],["לְכִי","p2fs"],["לְכוּ","p2mp"],["תֵּן","p2ms"],["תְּנִי","p2fs"],["תְּנוּ","p2mp"]],"Schwache Verben können im Imperativ verkürzte oder gedehnte Formen bilden.");

add(18,"Qal","Infinitiv constructus","שמר",[["שְׁמֹר",""]],"Der Infinitiv constructus ist bei starken Verben meist mit dem Imperativ 2. m. Sg. identisch.");
add(18,"Qal","Infinitiv constructus mit Präposition","שמר",[["לִשְׁמֹר","mit לְ"],["בִּשְׁמֹר","mit בְּ"],["כִּשְׁמֹר","mit כְּ"],["מִשְּׁמֹר","mit מִן"]],"Präpositionen können unmittelbar vor den Infinitiv constructus treten.");
add(18,"Qal","Infinitiv constructus mit Suffix","שמר",[["שָׁמְרִי","mein"],["שָׁמְרְךָ","dein m."],["שָׁמְרוֹ","sein"],["שָׁמְרָהּ","ihr"],["שָׁמְרֵנוּ","unser"]],"Am Infinitiv constructus bezeichnet das Suffix meist das logische Subjekt oder Objekt.");

function next(){answered2=false;update();document.getElementById("explanation-box").style.display="none";const available=pool(),choices=available.length>1?available.filter(x=>x!==previous):available;current=choices[Math.floor(Math.random()*choices.length)];previous=current;const wc=document.getElementById("word-container");wc.textContent=current.word;const answers=[...new Set(available.map(x=>x.answer))],wrong=sample(answers.filter(x=>x!==current.answer),5),shown=sample([current.answer,...wrong],6),oc=document.getElementById("options-container");oc.replaceChildren();shown.forEach((answer,index)=>{const b=document.createElement("button");b.type="button";b.className="answer-button";b.dataset.answer=answer;b.innerHTML=`<span>${answer}</span><span class="key">Taste ${index+1}</span>`;b.onclick=()=>check(answer);oc.appendChild(b)})}

lessonSelect2.onchange=e=>{lesson=parseInt(e.target.value,10);localStorage.setItem("heb_lesson",String(lesson));score2=0;streak2=0;previous=null;next()};document.getElementById("next-button").onclick=next;window.addEventListener("keydown",e=>{if(e.key==="Enter"&&answered2){next();return}const n=parseInt(e.key,10),buttons=[...document.querySelectorAll(".answer-button")];if(n>=1&&n<=buttons.length&&!answered2)check(buttons[n-1].dataset.answer)});next();
</script></body></html>
